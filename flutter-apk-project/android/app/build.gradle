def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterProperties = new Properties()
def flutterPropertiesFile = rootProject.file('flutter.properties')
if (flutterPropertiesFile.exists()) {
    flutterProperties.load(new FileInputStream(flutterPropertiesFile))
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.test.apk'
    compileSdkVersion flutterProperties['flutter.compileSdkVersion'] ?: 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main {
            java.srcDirs += ['src/main/kotlin']
        }
    }

    defaultConfig {
        applicationId 'com.test.apk'
        minSdkVersion flutterProperties['flutter.minSdkVersion'] ?: 24
        targetSdkVersion flutterProperties['flutter.targetSdkVersion'] ?: 34
        versionCode flutterProperties['flutter.versionCode'] ?: 1
        versionName flutterProperties['flutter.versionName'] ?: '1.0'
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile'] != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            // Debug builds - no signing config needed
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui:1.6.4'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.4'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.4'
    debugImplementation 'androidx.compose.ui:ui-tooling-companion:1.6.4'
}